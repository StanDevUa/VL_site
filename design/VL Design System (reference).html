document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

и<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px;\">\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--magenta); background: rgba(201,48,124,.09); padding: 5px 10px; border-radius: 7px;\">Анонс<\u002Fspan>\n            <span style=\"font-size: 13.5px; color: var(--navy-soft);\">12 вересня<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3; margin-bottom: 10px; color: var(--navy);\">Заголовок новини<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; color: var(--navy-soft);\">Короткий опис у одне-два речення.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: linear-gradient(170deg, rgba(251,239,236,.75), rgba(255,253,252,1)); border: 1px solid var(--line); border-radius: 14px; padding: 26px;\">\n        <div style=\"font-family: 'Nunito', sans-serif; font-size: 44px; line-height: 1; color: var(--magenta); opacity: .5; margin-bottom: 10px;\">“<\u002Fdiv>\n        <div style=\"font-size: 16.5px; line-height: 1.68; color: var(--navy); margin-bottom: 20px;\">Текст відгуку на три-чотири рядки, прямою мовою батьків.<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line);\">\n          <div style=\"width: 40px; height: 40px; border-radius: 10px; background: var(--grad); opacity: .85;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-weight: 700; font-size: 15px; color: var(--navy);\">Олена<\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: var(--navy-soft);\">мама Максима, 6 років<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"icons\" style=\"scroll-margin-top: 24px; margin-bottom: 20px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 26px; color: var(--navy);\">Іконки<\u002Fdiv>\n    <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; margin-bottom: 52px;\">\n      <div style=\"font-size: 14px; color: var(--navy-soft); margin-bottom: 22px;\">Лінійні, 24×24, stroke 1.7, круглі кінці. Завжди у скругленому квадраті з градієнтною заливкою — 46×46 / radius 13 у секціях, 38×38 / radius 11 у компактних блоках.<\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 24px;\">\n        <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"8\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; width: 108px;\">\n            <span style=\"width: 46px; height: 46px; border-radius: 13px; background: {{ ic.dot }}; display: flex; align-items: center; justify-content: center;\">\n              <svg width=\"25\" height=\"25\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                <path d=\"{{ ic.p1 }}\"><\u002Fpath>\n                <path d=\"{{ ic.p2 }}\"><\u002Fpath>\n                <path d=\"{{ ic.p3 }}\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"font-size: 11.5px; line-height: 1.35; text-align: center; color: var(--navy-soft);\">{{ ic.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding-top: 22px; border-top: 1px solid var(--line);\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 14px; color: var(--navy);\">Соцмережі<\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; align-items: center;\">\n          <span style=\"width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #2B6BB8, #7A3AA0); display: flex; align-items: center; justify-content: center;\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\"><path d=\"M13.5 21v-8h2.7l.4-3h-3.1V8.4c0-.9.3-1.4 1.4-1.4h1.8V4.2C16.2 4.1 15.2 4 14 4c-2.4 0-4 1.5-4 4.1V10H7.5v3H10v8z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #F2662F, #C9307C); display: flex; align-items: center; justify-content: center;\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17\" cy=\"7\" r=\"1\" fill=\"#fff\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #7A3AA0, #2B6BB8); display: flex; align-items: center; justify-content: center;\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\"><path d=\"M21.6 4.3 2.9 11.4c-.6.2-.6 1.1.1 1.3l4.3 1.3 1.6 4.8c.2.6 1 .7 1.4.2l2.2-2.5 4.3 3.1c.5.4 1.2.1 1.3-.5l3.3-13.9c.2-.6-.4-1.1-1-.9zM9.6 14.3l8-5.6-6.1 6.4-.2 3z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid rgba(30,42,90,.18); color: var(--navy); display: flex; align-items: center; justify-content: center;\">\n            <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M21.6 4.3 2.9 11.4c-.6.2-.6 1.1.1 1.3l4.3 1.3 1.6 4.8c.2.6 1 .7 1.4.2l2.2-2.5 4.3 3.1c.5.4 1.2.1 1.3-.5l3.3-13.9c.2-.6-.4-1.1-1-.9zM9.6 14.3l8-5.6-6.1 6.4-.2 3z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span style=\"font-size: 13.5px; color: var(--navy-soft);\">заливка градієнтом · контурний варіант для хедера<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"decor\" style=\"scroll-margin-top: 24px; margin-bottom: 20px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 26px; color: var(--navy);\">Декор і рух<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 52px;\">\n      <div style=\"position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-height: 230px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(--navy);\">Листочки<\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--navy-soft); max-width: 300px;\">Форма border-radius: 60% 10% 60% 10%. Два типи заливки — теплий і холодний. 14–26px, opacity .33–.5. Максимум 8 на сторінку, завжди всередині секції, ніколи на кнопках.<\u002Fdiv>\n        <div style=\"position: absolute; top: 30px; right: 60px; width: 26px; height: 40px; border-radius: 60% 10% 60% 10%; background: linear-gradient(140deg, #7A3AA0, #2B6BB8); opacity: .5;\"><\u002Fdiv>\n        <div style=\"position: absolute; bottom: 40px; right: 120px; width: 18px; height: 28px; border-radius: 60% 10% 60% 10%; background: linear-gradient(140deg, #F2662F, #C9307C); opacity: .45;\"><\u002Fdiv>\n        <div style=\"position: absolute; top: 120px; right: 40px; width: 14px; height: 14px; border-radius: 50%; background: #F2662F; opacity: .4;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-height: 230px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(--navy);\">Фонові плями<\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--navy-soft); max-width: 300px;\">radial-gradient з альфою .10–.16, що розчиняється в нуль на 70%. Виносяться за межі секції для безшовного переходу між блоками.<\u002Fdiv>\n        <div style=\"position: absolute; bottom: -90px; right: -60px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(122,58,160,.16), rgba(255,255,255,0) 70%);\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 14px; color: var(--navy);\">Поява при скролі<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--navy-soft);\">\n          <div style=\"display: flex; gap: 10px;\"><span style=\"font-family: ui-monospace, monospace; color: var(--navy); min-width: 96px;\">left / right<\u002Fspan>заголовки й текстові колонки<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><span style=\"font-family: ui-monospace, monospace; color: var(--navy); min-width: 96px;\">up / down<\u002Fspan>підводки, бейджі, кнопки<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><span style=\"font-family: ui-monospace, monospace; color: var(--navy); min-width: 96px;\">scale<\u002Fspan>фото й великі блоки<\u002Fdiv>\n          <div style=\"display: flex; gap: 10px;\"><span style=\"font-family: ui-monospace, monospace; color: var(--navy); min-width: 96px;\">stagger<\u002Fspan>сітки карток, крок 120ms<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--navy-soft); margin-top: 16px; line-height: 1.6;\">.85s cubic-bezier(.22,.7,.25,1) · після появи inline-transition знімається, щоб hover був швидким<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 14px; color: var(--navy);\">Тіні<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"padding: 14px 16px; border-radius: 11px; background: #fff; border: 1px solid var(--line); box-shadow: 0 14px 30px -12px rgba(82,82,172,.34); font-size: 14px; color: var(--navy-soft);\">Кнопка · 0 14px 30px −12px indigo/.34<\u002Fdiv>\n          <div style=\"padding: 14px 16px; border-radius: 11px; background: #fff; border: 1px solid var(--line); box-shadow: 0 24px 44px -26px rgba(30,42,90,.35); font-size: 14px; color: var(--navy-soft);\">Картка hover · 0 24px 44px −26px ink/.35<\u002Fdiv>\n          <div style=\"padding: 14px 16px; border-radius: 11px; background: #fff; border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(30,42,90,.35); font-size: 14px; color: var(--navy-soft);\">Фото · 0 30px 60px −30px ink/.35<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"layout\" style=\"scroll-margin-top: 24px; margin-bottom: 20px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 26px; color: var(--navy);\">Сітка й секції<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-bottom: 52px;\">\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 16px; color: var(--navy);\">Розміри<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 14.5px; color: var(--navy-soft);\">\n          <div>Контент — <strong style=\"color: var(--navy);\">max-width 1240px<\u002Fstrong>, хедер 1320px<\u002Fdiv>\n          <div>Бокові поля секції — <strong style=\"color: var(--navy);\">32px<\u002Fstrong><\u002Fdiv>\n          <div>Вертикальні паддінги секції — <strong style=\"color: var(--navy);\">96px<\u002Fstrong> (плашка фактів — 44/48px)<\u002Fdiv>\n          <div>Проміжки в сітках — <strong style=\"color: var(--navy);\">20–22px<\u002Fstrong><\u002Fdiv>\n          <div>Радіуси — <strong style=\"color: var(--navy);\">14px<\u002Fstrong> картки й фото, 18px великі блоки, 12px кнопки, 11px поля<\u002Fdiv>\n          <div>Липкий хедер — висота 76px, <strong style=\"color: var(--navy);\">scroll-padding-top 96px<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-weight: 700; font-size: 15px; margin-bottom: 16px; color: var(--navy);\">Анатомія секції<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"padding: 10px 14px; border-radius: 9px; background: rgba(122,58,160,.08); font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--violet);\">Eyebrow<\u002Fdiv>\n          <div style=\"padding: 10px 14px; border-radius: 9px; background: rgba(30,42,90,.05); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; color: var(--navy);\">H2 заголовок<\u002Fdiv>\n          <div style=\"padding: 10px 14px; border-radius: 9px; background: rgba(30,42,90,.04); font-size: 14px; color: var(--navy-soft);\">Lead, до 680px<\u002Fdiv>\n          <div style=\"padding: 10px 14px; border-radius: 9px; background: rgba(30,42,90,.04); font-size: 14px; color: var(--navy-soft);\">Контент — сітка карток або дві колонки<\u002Fdiv>\n          <div style=\"padding: 10px 14px; border-radius: 9px; background: rgba(82,82,172,.09); font-size: 14px; font-weight: 700; color: #5252AC;\">CTA + пояснювальний рядок поруч<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"rules\" style=\"scroll-margin-top: 24px; margin-bottom: 20px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 26px; color: var(--navy);\">Правила<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: #2E7D57; margin-bottom: 16px;\">Так<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; font-size: 15px; line-height: 1.6; color: var(--navy-soft);\">\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>Градієнт — на іконках, маркерах, цифрах, логотипі, CTA-блоці<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>Кнопки — однотонне індиго #5252AC<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>CTA в кожній великій секції, поруч — пояснювальний рядок<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>Скруглення фото 14px, без арок і кіл<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>Безшовні переходи: декор верхньої секції дорисовується в нижній<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #2E7D57;\"><\u002Fspan><span>Кожна нова сторінка отримує ті самі хедер, футер, кнопку «вгору» і перемикач мов<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px;\">\n        <div style=\"font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: #C0322C; margin-bottom: 16px;\">Ні<\u002Fdiv>\n        <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; font-size: 15px; line-height: 1.6; color: var(--navy-soft);\">\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Градієнт на кнопках<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Понад два кольори фону в межах екрана<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Декор, обрізаний межею секції<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Нумерація там, де елементи рівнозначні<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Емодзі<\u002Fspan><\u002Fli>\n          <li style=\"display: flex; gap: 10px;\"><span style=\"flex-shrink: 0; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #C0322C;\"><\u002Fspan><span>Довге тире «—» у текстах<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\"
